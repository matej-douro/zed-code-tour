[workspace]
resolver = "2"
members = [
    "crates/tour-lsp",
    "crates/zed-code-tour-extension",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/matej-douro/zed-code-tour"

[workspace.dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1.0"
url = "2.5"
# Schemas are not available in zed_extension_api 0.7.0. Pin the API from the
# Zed revision used by HANDOFF.md until 0.8.0 is published on crates.io.
zed_extension_api = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f" }
