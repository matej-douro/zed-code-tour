[package]
name = "zed-code-tour-extension"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]
test = false

[dependencies]
zed_extension_api.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/tour-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/matej-douro/zed-code-tour"

[workspace.dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1.0"
url = "2.5"
# 0.7.0 is the newest extension API supported by Zed Stable and Preview.
zed_extension_api = "0.7.0"
