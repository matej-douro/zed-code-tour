[package]
name = "zed-code-tour-extension"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]
test = false

[dependencies]
zed_extension_api.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/tour-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/matej-douro/zed-code-tour"

[workspace.dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1.0"
url = "2.5"
# Restores the 0.8.0-only settings schema hooks. Keep this pinned to the Zed
# revision used by HANDOFF.md until 0.8.0 is published on crates.io.
zed_extension_api = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f" }
